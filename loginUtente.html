<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Greener Clinic</title>
    <link rel="stylesheet" href="stylelog.css">
    <link rel="icon" href="clinica.ico" type="image/x-icon">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="header">
    <img src="clinic.png" alt="Greener Clinic Logo">
    <div class="separator"></div>
    <h1>Greener Clinic</h1>
    <div class="header-buttons">
        <!-- Botão Entrar -->
        <div class="dropdown-container">
            <button class="button" id="login-button">
                <img src="pfp.png" alt="Ícone de Perfil" class="icon">
                Entrar
            </button>
            <div class="dropdown" id="login-dropdown">
                <button class="dropdown-item" onclick="window.location.href='loginUtente.html'">Utente</button>
                <button class="dropdown-item" onclick="window.location.href='registoMedico.html'">Médico</button>
            </div>
        </div>

        <!-- Botão Registar -->
        <div class="dropdown-container">
            <button class="button" id="register-button">
                <img src="pfp.png" alt="Ícone de Perfil" class="icon">
                Registar
            </button>
            <div class="dropdown" id="register-dropdown">
                <button class="dropdown-item" onclick="window.location.href='registoUtente.html'">Utente</button>
                <button class="dropdown-item" onclick="window.location.href='registoMedico.html'">Médico</button>
            </div>
        </div>
		<div class="header-welcome" id="welcome-message" style="display: none;">
			<span>Olá, <span id="user-name"></span>!</span>
			<button class="Btn" id="logout-button">
			<div class="sign">
				<svg viewBox="0 0 512 512">
					<path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path>
				</svg>
			</div>
        <div class="text">Logout</div>
    </button>
</div>

    </div>
</div>
    <div class="nav">
        <a href="home.html">Página Principal</a>
        <a href="consulta.html">Marcar Consulta</a>
        <a href="receita.html">Pedir Receita</a>
        <a href="sobre.html">Sobre Nós</a>
    </div>
    <main class="main">
        <form class="form">
            <p class="form-title">Iniciar Sessão</p>
            <div class="input-container">
                <input type="text" placeholder="NºUtente ou Email" required>
            </div>
            <div class="input-container">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="submit">
                Entrar
            </button>
            <p class="signup-link">
                Não tem conta?
                <a href="registoUtente.html">Registe-se</a>
            </p>
        </form>
    </main>
    <div class="footer">
        <p>&copy; 2025 Greener Clinic | Realizado por Afonso Cunha e Bruno Barão</p>
    </div>
</body>
</html>
